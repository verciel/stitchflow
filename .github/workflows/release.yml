name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyembroidery pillow pyinstaller

      - name: Compile Standalone Python Engine
        run: |
          pyinstaller --onefile --distpath src-tauri/embroidery-engine/dist --workpath src-tauri/embroidery-engine/build --specpath src-tauri/embroidery-engine --name engine src-tauri/embroidery-engine/engine.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install NPM dependencies
        run: npm ci

      - name: Build Desktop Application (Tauri 2)
        run: npm run tauri build

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/stitchflow.exe
          draft: false
          prerelease: false
          generate_release_notes: true
